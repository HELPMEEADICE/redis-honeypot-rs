[package]
name = "redis-honeypot-rs"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "A tiny, high-interaction Redis honeypot written in pure Rust"
license = "GPL-3.0-or-later"
repository = "https://github.com/HELPMEEADICE/redis-honeypot-rs"
homepage = "https://github.com/HELPMEEADICE/redis-honeypot-rs"
readme = "README.md"
publish = false

[lib]
name = "redis_honeypot_rs"
path = "src/lib.rs"

[[bin]]
name = "redis-honeypot-rs"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.54", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "time",
    "sync",
    "macros",
    "signal",
] }
rusqlite = { version = "0.41", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4.6", features = ["derive"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
toml = "1.2"

[build-dependencies]
# Only used by build.rs to compile a getrandom(2) shim for mips; no other
# target invokes a C compiler of its own.
cc = "1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
debug = false
incremental = false
overflow-checks = false

# Dependencies get the same size treatment; they are ~90% of the binary.
[profile.release.package."*"]
opt-level = "z"
