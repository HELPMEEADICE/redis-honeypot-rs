name: Build

# Cross-compiled release binaries for nine targets.
#
#   * release published  -> build, then attach every archive to that release
#   * workflow_dispatch  -> build, archives downloadable from the run page
#
# The target list lives in .github/targets.json so it can be reviewed as data;
# `setup` filters it and feeds the build job a computed matrix, which is what
# lets `only` skip runners entirely instead of starting then idling them.
#
# The size profile lives in Cargo.toml ([profile.release]); Actions cannot
# override a profile per job, so the manifest is the single source of truth:
#   opt-level="z" lto="fat" codegen-units=1 panic="abort"
#   strip="debuginfo" debug=false incremental=false overflow-checks=false

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version_override:
        description: "Override the version string used in archive names (default: crate version)"
        required: false
        default: ""
      only:
        description: "Build a subset by matrix name, comma separated, no spaces (e.g. linux-mips,macos-aarch64)"
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN: redis-honeypot-rs

jobs:
  setup:
    name: resolve version and matrix
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      matrix: ${{ steps.resolve.outputs.matrix }}
      count: ${{ steps.resolve.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        shell: bash
        env:
          OVERRIDE: ${{ inputs.version_override }}
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail

          version="${OVERRIDE:-}"
          if [ -z "$version" ]; then
            version=$(cargo metadata --no-deps --format-version 1 --locked \
              | jq -r '.packages[] | select(.name == "redis-honeypot-rs") | .version')
          fi
          [ -n "$version" ] || { echo "could not resolve the crate version" >&2; exit 1; }

          matrix=$(jq -c '.' .github/targets.json)
          if [ -n "${ONLY:-}" ]; then
            matrix=$(jq -c --arg only "$ONLY" '
              ($only | split(",") | map(gsub("^\\s+|\\s+$"; ""))) as $want
              | [ .[] | select(.name as $n | $want | index($n)) ]
            ' .github/targets.json)
          fi

          count=$(printf '%s' "$matrix" | jq 'length')
          if [ "$count" -eq 0 ]; then
            echo "no target matched only=\"${ONLY}\"; valid names:" >&2
            jq -r '.[].name' .github/targets.json >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "matrix=$matrix"
            echo "count=$count"
          } >> "$GITHUB_OUTPUT"

          echo "version: $version   targets: $count"
          printf '%s' "$matrix" | jq -r '.[] | "  - \(.name)  \(.target)  on \(.os)  via \(.builder)"'

  build:
    name: ${{ matrix.name }}
    needs: setup
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      # One broken target must not hide the other eight.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      TARGET: ${{ matrix.target }}
      EXT: ${{ matrix.ext }}
      VERSION: ${{ needs.setup.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain (target ships a prebuilt std)
        if: matrix.install_target != ''
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.install_target }}
          components: ${{ matrix.components }}

      - name: "Toolchain (tier 3: build std from source)"
        if: matrix.install_target == ''
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rust-src



# mips is tier 3 (no prebuilt std): nightly + -Z build-std, and cross because
      # Ubuntu 24.04 dropped the gcc-mips-linux-gnu package that older runners had.
      - name: Install cross
        if: matrix.builder == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        shell: bash
        env:
          BUILDER: ${{ matrix.builder }}
          EXTRA: ${{ matrix.extra_args }}
        run: |
          set -euo pipefail
          args=(build --release --locked --target "$TARGET")
          # Word splitting is intentional: EXTRA carries several flags, or none.
          if [ -n "${EXTRA:-}" ]; then
            # shellcheck disable=SC2206
            args+=($EXTRA)
          fi
          echo "+ ${BUILDER} ${args[*]}"
          case "$BUILDER" in
            cross) cross "${args[@]}" ;;
            *)     cargo "${args[@]}" ;;
          esac

      - name: Report size and file type
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${TARGET}/release/${BIN}${EXT}"
          ls -l "$bin"
          du -h "$bin"
          file "$bin" || true

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/staging"
          rm -rf "$staging"
          mkdir -p "$staging" dist
          cp "target/${TARGET}/release/${BIN}${EXT}" "$staging/"
          cp README.md LICENSE "$staging/"
          case "$TARGET" in
            *linux*)
              mkdir -p "$staging/deploy"
              cp deploy/redis-honeypot-rs.service deploy/config.example.toml "$staging/deploy/"
              ;;
          esac
          tar -czf "dist/${BIN}-${VERSION}-${TARGET}.tar.gz" -C "$staging" .
          ls -l dist

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $staging = Join-Path $env:RUNNER_TEMP 'staging'
          if (Test-Path $staging) { Remove-Item -Recurse -Force $staging }
          New-Item -ItemType Directory -Force -Path $staging, dist | Out-Null
          Copy-Item "target/$env:TARGET/release/$env:BIN$env:EXT" $staging
          Copy-Item README.md, LICENSE $staging
          Compress-Archive -Path "$staging/*" -DestinationPath "dist/$env:BIN-$env:VERSION-$env:TARGET.zip" -Force
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload the archive as an Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN }}-${{ env.VERSION }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: attach archives to the release
    if: github.event_name == 'release'
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          ls -l dist
          cd dist
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name)  \(.size) bytes"'
